<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Se connecter</h5>
          <div *ngIf="error" class="alert alert-danger">{{error}}</div>
          <div class="mb-2">
            <input [(ngModel)]="username" class="form-control" placeholder="Username">
          </div>
          <div class="mb-2">
            <input [(ngModel)]="password" type="password" class="form-control" placeholder="Password">
          </div>
          <button class="btn btn-primary w-100" (click)="submit()">Connexion</button>
        </div>
      </div>
    </div>
  </div>
</div>
